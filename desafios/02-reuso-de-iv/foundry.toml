# Projeto Foundry deste desafio. Rode os comandos `forge` a partir desta pasta.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["../../lib"]                                  # forge-std compartilhado na raiz do repositório
remappings = ["forge-std/=../../lib/forge-std/src/"]

# Endpoints usados por `--rpc-url <nome>`.
[rpc_endpoints]
xrpl_testnet = "https://rpc.testnet.xrplevm.org"   # XRPL EVM Testnet (chainId 1449000), público
anvil = "http://127.0.0.1:8545"
# sepolia = "${SEPOLIA_RPC_URL}"                   # descomente e preencha o .env para usar a Sepolia

# A XRPL EVM usa Blockscout (sem chave): passe --verifier blockscout --verifier-url na linha de comando.
# [etherscan]
# sepolia = { key = "${ETHERSCAN_API_KEY}" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
