[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Endpoints usados por `--rpc-url <nome>`. Os valores vêm do .env (veja .env.example).
[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
anvil = "http://127.0.0.1:8545"

# Usado por `--verify` para publicar o código-fonte no Etherscan.
[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
