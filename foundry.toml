[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Endpoints usados por `--rpc-url <nome>`.
[rpc_endpoints]
xrpl_testnet = "https://rpc.testnet.xrplevm.org"   # XRPL EVM Testnet (chainId 1449000), público
anvil = "http://127.0.0.1:8545"
